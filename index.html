<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Kompa - Mayorista Tech & Bazar</title>
    <style>
        :root {
            --primary: #00f0ff;
            --dark: #0d0e15;
            --card-bg: #181a26;
            --text: #ffffff;
            --admin-color: #ff0055;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--text);
            padding-bottom: 80px;
        }

        header {
            background: linear-gradient(135deg, #1e2235, #0d0e15);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
        }

        header.admin-header {
            border-bottom: 2px solid var(--admin-color);
        }

        .admin-badge {
            background-color: var(--admin-color);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-top: 5px;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Buscador y Filtros */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-bar, .category-select {
            width: 100%;
            padding: 12px;
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }

        .search-bar:focus, .category-select:focus {
            border-color: var(--primary);
            outline: none;
        }

        /* Ruleta de Premios */
        .ruleta-section {
            background: linear-gradient(135deg, #23273a, #131520);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px dashed var(--primary);
        }

        .wheel-btn {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .wheel-btn:hover {
            transform: scale(1.05);
        }

        /* Grid de Productos */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #252836;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
        }

        .product-card.admin-mode {
            border: 1px solid var(--admin-color);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #111;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .product-meta {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .pack-badge {
            background-color: #2a2e45;
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .price-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 10px;
        }

        .product-price {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
        }

        .admin-mode .product-price {
            color: var(--admin-color);
        }

        /* Botones de acción */
        .buy-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-qty {
            background-color: #252836;
            color: white;
            border: 1px solid #444;
            width: 32px;
            height: 32px;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        .qty-num {
            font-size: 16px;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .btn-admin-action {
            background-color: var(--admin-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            text-align: center;
        }

        /* Barra de Carrito Flotante fijo abajo */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1e2235;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid var(--primary);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: black;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .controls-wrapper {
                flex-direction: row;
            }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <h1>Tu Kompa Mayorista</h1>
        <p>Catálogo Digital Autogestionado</p>
        <div id="admin-indicator" style="display: none;">
            <span class="admin-badge">MODO ADMINISTRADOR (COSTOS BASE)</span>
        </div>
    </header>

    <div class="container">
        
        <div class="ruleta-section" id="ruleta-container">
            <h3>🎁 ¡Girá la ruleta de la suerte mayorista!</h3>
            <p id="ruleta-msg">Sumá un descuento extra para tu pedido de hoy</p>
            <button class="wheel-btn" onclick="girarRuleta()">GIRAR RULETA</button>
        </div>

        <div class="controls-wrapper">
            <input type="text" id="search" class="search-bar" placeholder="Buscar por palabra clave o código..." oninput="filtrarCatalogo()">
            <select id="category-filter" class="category-select" onchange="filtrarCatalogo()">
                <option value="TODOS">Todos los rubros</option>
            </select>
        </div>

        <div class="products-grid" id="grid-productos"></div>

    </div>

    <div class="cart-bar" id="barra-carrito">
        <div>
            <p>Items seleccionados: <span id="cart-count">0</span></p>
            <h3>Total: <span id="cart-total">$0</span></h3>
        </div>
        <button class="btn-whatsapp" onclick="enviarPedidoWhatsApp()">Enviar pedido por WhatsApp 🚀</button>
    </div>

    <script src="productos.js"></script>

    <script>
        // Verificamos si entramos con ?admin=true
        const urlParams = new URLSearchParams(window.location.search);
        const esAdmin = urlParams.get('admin') === 'true';

        let carrito = {};
        let descuentoAplicado = 0;

        // Configuración inicial basada en el rol
        if (esAdmin) {
            document.getElementById('main-header').classList.add('admin-header');
            document.getElementById('admin-indicator').style.display = 'block';
            document.getElementById('ruleta-container').style.display = 'none';
            document.getElementById('barra-carrito').style.display = 'none';
            // Modificamos el margen inferior del body ya que no está la barra de carrito
            document.body.style.paddingBottom = "20px";
        }

        // Cargar las categorías dinámicamente en el desplegable
        function inicializarCategorias() {
            const select = document.getElementById('category-filter');
            // Extraemos categorías únicas del archivo generado por Python
            const categorias = [...new Set(PRODUCTOS_DATA.map(p => p.category))];
            
            categorias.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        // Renderizado del catálogo completo
        function renderizarProductos(productos) {
            const grid = document.getElementById('grid-productos');
            grid.innerHTML = '';

            if (productos.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">No se encontraron productos.</p>';
                return;
            }

            productos.forEach(prod => {
                // Si es admin ve el precio directo del excel. Si es cliente, sumamos un 35% de ganancia estimada por defecto
                const precioFinal = esAdmin ? prod.price : Math.round(prod.price * 1.35);
                const cantidadEnCarrito = carrito[prod.id] ? carrito[prod.id].cantidad : 0;

                const card = document.createElement('div');
                card.className = `product-card ${esAdmin ? 'admin-mode' : ''}`;

                card.innerHTML = `
                    <img class="product-img" src="${prod.image}" alt="${prod.name}">
                    <div class="product-info">
                        <div>
                            <div class="product-title">${prod.name}</div>
                            <div class="product-meta">
                                Cód: <strong>${prod.id}</strong> | Pack bulto: <span class="pack-badge">${prod.pack} u.</span>
                            </div>
                        </div>
                        
                        <div class="price-container">
                            <div class="product-price">$${precioFinal.toLocaleString('es-AR')}</div>
                            
                            ${!esAdmin ? `
                                <div class="buy-controls">
                                    <button class="btn-qty" onclick="actualizarCarrito('${prod.id}', -1, ${precioFinal}, '${prod.name}')">-</button>
                                    <span class="qty-num" id="qty-${prod.id}">${cantidadEnCarrito}</span>
                                    <button class="btn-qty" onclick="actualizarCarrito('${prod.id}', 1, ${precioFinal}, '${prod.name}')">+</button>
                                </div>
                            ` : ''}
                        </div>

                        ${esAdmin ? `
                            <button class="btn-admin-action" onclick="copiarCodigo('${prod.id}')">
                                📋 Copiar Código Proveedor
                            </button>
                        ` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Filtro combinado de buscador de texto + desplegable de rubros
        function filtrarCatalogo() {
            const query = document.getElementById('search').value.toLowerCase();
            const categoria = document.getElementById('category-filter').value;

            const filtrados = PRODUCTOS_DATA.filter(prod => {
                const cumpleFiltroTexto = prod.name.toLowerCase().includes(query) || prod.id.toLowerCase().includes(query);
                const cumpleFiltroCategoria = (categoria === 'TODOS' || prod.category === categoria);
                return cumpleFiltroTexto && cumpleFiltroCategoria;
            });

            renderizarProductos(filtrados);
        }

        // Lógica del Carrito de Compras
        function actualizarCarrito(id, cambio, precio, name) {
            if (!carrito[id]) {
                carrito[id] = { name: name, precio: precio, cantidad: 0 };
            }

            carrito[id].cantidad += cambio;

            if (carrito[id].cantidad <= 0) {
                delete carrito[id];
                const el = document.getElementById(`qty-${id}`);
                if (el) el.textContent = 0;
            } else {
                const el = document.getElementById(`qty-${id}`);
                if (el) el.textContent = carrito[id].cantidad;
            }

            calcularTotales();
        }

        function calcularTotales() {
            let totalItems = 0;
            let subtotal = 0;

            for (const id in carrito) {
                totalItems += carrito[id].cantidad;
                subtotal += carrito[id].precio * carrito[id].cantidad;
            }

            if (descuentoAplicado > 0) {
                subtotal = subtotal * (1 - (descuentoAplicado / 100));
            }

            document.getElementById('cart-count').textContent = totalItems;
            document.getElementById('cart-total').textContent = `$${Math.round(subtotal).toLocaleString('es-AR')}`;
        }

        // Función del Administrador para copiar códigos al portapapeles rápido
        function copiarCodigo(codigo) {
            navigator.clipboard.writeText(codigo).then(() => {
                alert(`Código ${codigo} copiado para buscar en el proveedor.`);
            });
        }

        // Mini juego de Ruleta
        function girarRuleta() {
            const premios = [5, 10, 15, 0];
            const resultado = premios[Math.floor(Math.random() * premios.length)];
            
            if (resultado > 0) {
                descuentoAplicado = resultado;
                document.getElementById('ruleta-msg').innerHTML = `🎉 ¡Ganaste un <strong>${resultado}% de DESCUENTO</strong> en el total de tu orden!`;
            } else {
                document.getElementById('ruleta-msg').textContent = "❌ ¡Casi! Seguí intentando en tu próxima compra.";
            }
            calcularTotales();
        }

        // Armado del mensaje estructurado para WhatsApp
        function enviarPedidoWhatsApp() {
            let keys = Object.keys(carrito);
            if (keys.length === 0) {
                alert("Tu carrito está vacío. Agregá productos antes de enviar.");
                return;
            }

            let mensaje = "🛒 *NUEVO PEDIDO MAYORISTA - TU KOMPA*\n\n";
            let total = 0;

            keys.forEach(id => {
                let item = carrito[id];
                let sub = item.precio * item.cantidad;
                total += sub;
                mensaje += `• *${item.name}*\n  Cantidad: ${item.cantidad} u. | Subtotal: $${sub.toLocaleString('es-AR')}\n  _Ref: ${id}_\n\n`;
            });

            if (descuentoAplicado > 0) {
                total = total * (1 - (descuentoAplicado / 100));
                mensaje += `🎁 *Descuento Ruleta:* ${descuentoAplicado}%\n`;
            }

            mensaje += `💰 *TOTAL ESTIMADO A PAGAR: $${Math.round(total).toLocaleString('es-AR')}*`;
            
            // Reemplazá por tu número de WhatsApp real de atención comercial
            const nroTelefono = "5492664000000"; 
            const urlText = encodeURIComponent(mensaje);
            window.open(`https://api.whatsapp.com/send?phone=${nroTelefono}&text=${urlText}`, '_blank');
        }

        // Inicializar la aplicación al cargar la página
        window.onload = () => {
            if (typeof PRODUCTOS_DATA !== 'undefined') {
                inicializarCategorias();
                renderizarProductos(PRODUCTOS_DATA);
            } else {
                document.getElementById('grid-productos').innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:red;">Error: No se encontró el archivo productos.js. Ejecutá primero sincronizar.py</p>';
            }
        };
    </script>
</body>
</html>
