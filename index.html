<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Kompa - Mayorista Tech & Bazar</title>
    <style>
        :root {
            --primary: #00f0ff;
            --dark: #0d0e15;
            --card-bg: #181a26;
            --text: #ffffff;
            --admin-color: #ff0055;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--text);
            padding-bottom: 80px;
        }

        header {
            background: linear-gradient(135deg, #1e2235, #0d0e15);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            background-color: var(--card-bg);
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .category-btn {
            background-color: var(--card-bg);
            color: white;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
        }

        .category-btn.active {
            background-color: var(--primary);
            color: var(--dark);
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #222;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            height: 40px;
            overflow: hidden;
        }

        .card-price {
            font-size: 20px;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-pack {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .qty-btn {
            background-color: #2c2f48;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        .qty-input {
            width: 50px;
            text-align: center;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .footer-cart {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1e2235;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid var(--primary);
            z-index: 100;
        }

        .checkout-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tu Kompa</h1>
        <p style="color: var(--primary);">Catálogo Mayorista Tech & Bazar</p>
    </header>

    <div class="container">
        <input type="text" class="search-box" id="search" placeholder="Buscar productos por nombre o código..." oninput="filtrarProductos()">
        
        <div class="categories" id="categories-container">
            </div>

        <div class="grid" id="grid-productos">
            </div>
    </div>

    <div class="footer-cart">
        <div>
            <p id="cart-summary">Items: 0 | Total: $0</p>
        </div>
        <button class="checkout-btn" onclick="enviarPedidoWhatsApp()">Enviar Pedido por WhatsApp</button>
    </div>

    <script src="productos.js"></script>
    <script>
        let carrito = {};
        let categoriaSeleccionada = 'TODOS';

        function inicializarCategorias() {
            const categorias = ['TODOS', ...new Set(PRODUCTOS_DATA.map(p => p.category))];
            const container = document.getElementById('categories-container');
            container.innerHTML = categorias.map(cat => 
                `<button class="category-btn ${cat === 'TODOS' ? 'active' : ''}" onclick="cambiarCategoria('${cat}', this)">${cat}</button>`
            ).join('');
        }

        function cambiarCategoria(cat, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            categoriaSeleccionada = cat;
            filtrarProductos();
        }

        function renderizarProductos(lista) {
            const grid = document.getElementById('grid-productos');
            if (lista.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 20px; color:#aaa;">No se encontraron productos.</p>';
                return;
            }

            grid.innerHTML = lista.map(p => {
                const qty = carrito[p.id] ? carrito[p.id].cantidad : 0;
                return `
                    <div class="card">
                        <img src="${p.image}" class="card-img" alt="${p.name}">
                        <div class="card-content">
                            <div class="card-title">[${p.id}] ${p.name}</div>
                            <div class="card-price">$${p.price.toLocaleString('es-AR')}</div>
                            <div class="card-pack">Bulto Cerrado: X${p.pack} u.</div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="modificarCantidad('${p.id}', -1)">-</button>
                                <input type="text" class="qty-input" id="qty-${p.id}" value="${qty}" readonly>
                                <button class="qty-btn" onclick="modificarCantidad('${p.id}', 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function modificarCantidad(id, cambio) {
            const prod = PRODUCTOS_DATA.find(p => p.id === id);
            if (!carrito[id]) {
                carrito[id] = { name: prod.name, precio: prod.price, cantidad: 0 };
            }

            carrito[id].cantidad += cambio;

            if (carrito[id].cantidad <= 0) {
                delete carrito[id];
                if(document.getElementById(`qty-${id}`)) document.getElementById(`qty-${id}`).value = 0;
            } else {
                if(document.getElementById(`qty-${id}`)) document.getElementById(`qty-${id}`).value = carrito[id].cantidad;
            }

            actualizarResumenFooter();
        }

        function filtrarProductos() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtrados = PRODUCTOS_DATA.filter(p => {
                const cumpleFiltro = (categoriaSeleccionada === 'TODOS' || p.category === categoriaSeleccionada);
                const cumpleBusqueda = p.name.toLowerCase().includes(query) || p.id.toLowerCase().includes(query);
                return cumpleFiltro && cumpleBusqueda;
            });
            renderizarProductos(filtrados);
        }

        function actualizarResumenFooter() {
            let totalItems = 0;
            let totalDinero = 0;
            Object.keys(carrito).forEach(id => {
                totalItems += carrito[id].cantidad;
                totalDinero += carrito[id].precio * carrito[id].cantidad;
            });
            document.getElementById('cart-summary').innerText = `Items: ${totalItems} | Total: $${totalDinero.toLocaleString('es-AR')}`;
        }

        function enviarPedidoWhatsApp() {
            const keys = Object.keys(carrito);
            if (keys.length === 0) {
                alert("El carrito está vacío.");
                return;
            }

            let mensaje = "🛒 *NUEVO PEDIDO MAYORISTA - TU KOMPA*\n\n";
            let total = 0;

            keys.forEach(id => {
                let item = carrito[id];
                let sub = item.precio * item.cantidad;
                total += sub;
                mensaje += `• *${item.name}*\n  Cantidad: ${item.cantidad} u. | Subtotal: $${sub.toLocaleString('es-AR')}\n  _Ref: ${id}_\n\n`;
            });

            mensaje += `💰 *TOTAL ESTIMADO A PAGAR: $${Math.round(total).toLocaleString('es-AR')}*`;
            
            const nroTelefono = "5492664000000"; // Reemplaza por tu número comercial real
            window.open(`https://api.whatsapp.com/send?phone=${nroTelefono}&text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        window.onload = () => {
            if (typeof PRODUCTOS_DATA !== 'undefined') {
                inicializarCategorias();
                renderizarProductos(PRODUCTOS_DATA);
            } else {
                document.getElementById('grid-productos').innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:red;">Error: No se encontró el archivo de datos de productos.</p>';
            }
        };
    </script>
</body>
</html>
