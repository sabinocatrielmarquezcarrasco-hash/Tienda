<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Kompa Tienda | Electrónica Márquez</title>
    <style>
        :root {
            --primary-color: #002366; /* Azul Marino */
            --accent-color: #ff6600;  /* Naranja */
            --bg-color: #f4f7f6;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); margin: 0; }
        
        header { background-color: var(--primary-color); color: white; padding: 25px; text-align: center; }
        
        .container { max-width: 1200px; margin: auto; padding: 20px; }

        /* Grid de Productos */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 20px; 
        }

        .card { 
            background: #fff; border-radius: 12px; padding: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center;
        }

        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        
        h3 { font-size: 16px; margin: 15px 0; color: #333; }
        
        .price { font-size: 20px; color: var(--primary-color); font-weight: bold; margin: 10px 0; }

        button { 
            background-color: var(--accent-color); color: white; border: none; 
            padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>TU KOMPA TIENDA</h1>
    <p>Electrónica Márquez - Tecnología de Confianza</p>
</header>

<div class="container">
    <div class="grid" id="grid-productos">
        </div>
</div>

<script>
    // Función para renderizar los productos
    function renderizar() {
        const grid = document.getElementById('grid-productos');
        // Asumimos que window.PRODUCTOS_DATA viene de tu archivo productos.js
        if (typeof window.PRODUCTOS_DATA === 'undefined') return;

        grid.innerHTML = window.PRODUCTOS_DATA.map(p => `
            <div class="card">
                <img src="${p.images ? p.images[0] : 'placeholder.jpg'}" alt="${p.name}">
                <h3>${p.name}</h3>
                <p class="price">$ ${Number(p.price || 0).toLocaleString('es-AR')}</p>
                <button onclick="alert('Iniciando pago para: ${p.name}')">Comprar Ahora</button>
            </div>
        `).join('');
    }

    // Ejecutar carga al terminar de cargar el documento
    document.addEventListener('DOMContentLoaded', renderizar);
</script>

<script src="productos.js"></script>

</body>
</html>
