<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Kompa - Mayorista Tech & Bazar</title>
    <style>
        :root {
            --primary: #00f0ff;
            --dark: #0d0e15;
            --card-bg: #181a26;
            --text: #ffffff;
            --accent: #25d366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--text);
            padding-bottom: 90px;
        }

        header {
            background: linear-gradient(135deg, #1e2235, #0d0e15);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            background-color: var(--card-bg);
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
            outline: none;
        }
        .search-box:focus {
            border-color: var(--primary);
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .categories::-webkit-scrollbar {
            height: 5px;
        }
        .categories::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .category-btn {
            background-color: var(--card-bg);
            color: white;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .category-btn.active {
            background-color: var(--primary);
            color: var(--dark);
            font-weight: bold;
            border-color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
        }

        /* Contenedor del "GIF" Animado o Transición Automática */
        .image-container {
            width: 100%;
            height: 200px;
            position: relative;
            overflow: hidden;
            background-color: #111;
        }

        .gif-frame {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .gif-frame.active {
            opacity: 1;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            height: 42px;
            overflow: hidden;
            line-height: 1.4;
        }

        .card-price {
            font-size: 22px;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 8px;
        }

        /* Selector de Variantes de Color / Factor de Venta */
        .variant-section {
            margin-bottom: 15px;
        }
        .variant-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }
        .variant-select {
            width: 100%;
            background-color: #25283b;
            color: white;
            border: 1px solid #444;
            padding: 6px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .card-pack {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            gap: 10px;
        }

        .qty-btn {
            background-color: #2c2f48;
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            transition: background 0.2s;
        }
        .qty-btn:hover {
            background-color: #3d4266;
        }

        .qty-input {
            width: 50px;
            text-align: center;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .footer-cart {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1e2235;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid var(--primary);
            z-index: 100;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }

        #cart-summary {
            font-size: 16px;
            font-weight: 500;
        }

        .checkout-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s;
        }
        .checkout-btn:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <header>
        <h1>Tu Kompa</h1>
        <p style="color: var(--primary); margin-top: 5px; font-size: 14px; letter-spacing: 1px;">DISTRIBUIDORA MAYORISTA</p>
    </header>

    <div class="container">
        <input type="text" class="search-box" id="search" placeholder="Buscar por palabra clave o código de artículo..." oninput="filtrarProductos()">
        
        <div class="categories" id="categories-container"></div>

        <div class="grid" id="grid-productos"></div>
    </div>

    <div class="footer-cart">
        <div>
            <p id="cart-summary">Items: 0 | Total: $0</p>
        </div>
        <button class="checkout-btn" onclick="enviarPedidoWhatsApp()">Confirmar Pedido (WhatsApp)</button>
    </div>

    <script src="productos.js"></script>
    <script>
        let carrito = {};
        let categoriaSeleccionada = 'TODOS';
        let intervals = []; // Guardar intervalos de los "GIFs" animaciones

        function inicializarCategorias() {
            const categorias = ['TODOS', ...new Set(PRODUCTOS_DATA.map(p => p.category))];
            const container = document.getElementById('categories-container');
            container.innerHTML = categorias.map(cat => 
                `<button class="category-btn ${cat === 'TODOS' ? 'active' : ''}" onclick="cambiarCategoria('${cat}', this)">${cat}</button>`
            ).join('');
        }

        function cambiarCategoria(cat, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            categoriaSeleccionada = cat;
            filtrarProductos();
        }

        function renderizarProductos(lista) {
            // Limpiar intervalos de animación anteriores
            intervals.forEach(clearInterval);
            intervals = [];

            const grid = document.getElementById('grid-productos');
            if (lista.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 40px; color:#aaa;">No hay artículos que coincidan con la búsqueda.</p>';
                return;
            }

            grid.innerHTML = lista.map(p => {
                // Si el producto no tiene un array de imágenes, creamos uno por defecto simulando el cambio
                const imagenes = (p.images && p.images.length > 0) ? p.images : [p.image, p.image];
                
                // Si el producto no tiene variantes por defecto, creamos opciones básicas de venta
                const variantes = p.variants || ["Predeterminado", "Unidad Alternativa"];

                const uniqueCartKey = p.id;
                const qty = carrito[uniqueCartKey] ? carrito[uniqueCartKey].cantidad : 0;
                const selectedVar = carrito[uniqueCartKey] ? carrito[uniqueCartKey].variante : variantes[0];

                // Generar el marcado de imágenes para el efecto GIF
                const imagesHtml = imagenes.map((imgUrl, index) => 
                    `<img src="${imgUrl}" class="gif-frame ${index === 0 ? 'active' : ''}" data-prod="${p.id}" data-index="${index}" alt="${p.name}">`
                ).join('');

                // Generar opciones del selector de factor de venta
                const optionsHtml = variantes.map(v => 
                    `<option value="${v}" ${v === selectedVar ? 'selected' : ''}>${v}</option>`
                ).join('');

                return `
                    <div class="card" id="card-${p.id}">
                        <div class="image-container">
                            ${imagesHtml}
                        </div>
                        <div class="card-content">
                            <div class="card-title"><strong>[${p.id}]</strong> ${p.name}</div>
                            <div class="card-price">$${p.price.toLocaleString('es-AR')}</div>
                            
                            <div class="variant-section">
                                <label class="variant-label">Color / Factor de Venta:</label>
                                <select class="variant-select" onchange="actualizarVariante('${p.id}', this.value)">
                                    ${optionsHtml}
                                </select>
                            </div>

                            <div class="card-pack">
                                <span>Bulto: X${p.pack} u.</span>
                                <span style="color: var(--primary)">Cat: ${p.category}</span>
                            </div>
                            
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="modificarCantidad('${p.id}', -1)">-</button>
                                <input type="text" class="qty-input" id="qty-${p.id}" value="${qty}" readonly>
                                <button class="qty-btn" onclick="modificarCantidad('${p.id}', 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Iniciar la animación automática tipo GIF para las imágenes
            iniciarEfectoGif();
        }

        // Función que alterna las imágenes simulando un GIF de producto dinámico
        function iniciarEfectoGif() {
            const containers = document.querySelectorAll('.image-container');
            containers.forEach(container => {
                const frames = container.querySelectorAll('.gif-frame');
                if (frames.length > 1) {
                    let currentFrame = 0;
                    const intervalId = setInterval(() => {
                        frames[currentFrame].classList.remove('active');
                        currentFrame = (currentFrame + 1) % frames.length;
                        frames[currentFrame].classList.add('active');
                    }, 2200); // Cambia de cuadro cada 2.2 segundos de forma fluida
                    intervals.push(intervalId);
                }
            });
        }

        function actualizarVariante(id, valor) {
            if (carrito[id]) {
                carrito[id].variante = valor;
            } else {
                const prod = PRODUCTOS_DATA.find(p => p.id === id);
                carrito[id] = { name: prod.name, precio: prod.price, cantidad: 0, variante: valor };
            }
            actualizarResumenFooter();
        }

        function modificarCantidad(id, cambio) {
            const prod = PRODUCTOS_DATA.find(p => p.id === id);
            const selectElement = document.querySelector(`#card-${id} .variant-select`);
            const varianteActiva = selectElement ? selectElement.value : "Predeterminado";

            if (!carrito[id]) {
                carrito[id] = { name: prod.name, precio: prod.price, cantidad: 0, variante: varianteActiva };
            }

            carrito[id].cantidad += cambio;

            if (carrito[id].cantidad <= 0) {
                delete carrito[id];
                if(document.getElementById(`qty-${id}`)) document.getElementById(`qty-${id}`).value = 0;
            } else {
                if(document.getElementById(`qty-${id}`)) document.getElementById(`qty-${id}`).value = carrito[id].cantidad;
            }

            actualizarResumenFooter();
        }

        function filtrarProductos() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtrados = PRODUCTOS_DATA.filter(p => {
                const cumpleFiltro = (categoriaSeleccionada === 'TODOS' || p.category === categoriaSeleccionada);
                const cumpleBusqueda = p.name.toLowerCase().includes(query) || p.id.toLowerCase().includes(query);
                return cumpleFiltro && cumpleBusqueda;
            });
            renderizarProductos(filtrados);
        }

        function actualizarResumenFooter() {
            let totalItems = 0;
            let totalDinero = 0;
            Object.keys(carrito).forEach(id => {
                totalItems += carrito[id].cantidad;
                totalDinero += carrito[id].precio * carrito[id].cantidad;
            });
            document.getElementById('cart-summary').innerText = `Items: ${totalItems} | Total: $${totalDinero.toLocaleString('es-AR')}`;
        }

        function enviarPedidoWhatsApp() {
            const keys = Object.keys(carrito);
            if (keys.length === 0) {
                alert("Por favor, agrega al menos un artículo al carrito.");
                return;
            }

            let mensaje = "🛒 *NUEVO PEDIDO MAYORISTA - TU KOMPA*\n\n";
            let total = 0;

            keys.forEach(id => {
                let item = carrito[id];
                let sub = item.precio * item.cantidad;
                total += sub;
                mensaje += `• *[${id}] ${item.name}*\n  Opcion/Color: _${item.variante}_\n  Cantidad: ${item.cantidad} u. | Subtotal: $${sub.toLocaleString('es-AR')}\n\n`;
            });

            mensaje += `💰 *TOTAL ESTIMADO: $${Math.round(total).toLocaleString('es-AR')}*`;
            
            const nroTelefono = "5492664000000"; // Tu número de atención comercial
            window.open(`https://api.whatsapp.com/send?phone=${nroTelefono}&text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        window.onload = () => {
            if (typeof PRODUCTOS_DATA !== 'undefined') {
                inicializarCategorias();
                renderizarProductos(PRODUCTOS_DATA);
            } else {
                document.getElementById('grid-productos').innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:red;">Error crítico: No se encontró la base de datos de productos.</p>';
            }
        };
    </script>
</body>
</html>
